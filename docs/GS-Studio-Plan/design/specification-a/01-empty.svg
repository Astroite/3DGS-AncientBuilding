<rect x="0" y="0" width="1920" height="72" rx="0" fill="#1B2225" stroke="none" /><line x1="0" y1="72" x2="1920" y2="72" stroke="#354247" stroke-width="1" /><rect x="24" y="23" width="26" height="26" rx="6" fill="#77D6C3" stroke="none" /><text x="37" y="42" font-size="18" fill="#102A24" font-weight="700" text-anchor="middle">G</text><text x="64" y="44" font-size="22" fill="#EAF1F0" font-weight="600" >GS Studio</text><text x="224" y="44" font-size="17" fill="#A5B4B6" font-weight="400" >新项目</text><rect x="1426" y="21" width="100" height="30" rx="15" fill="#233D39" stroke="none" /><text x="1476" y="42" font-size="14" fill="#77D6C3" font-weight="600" text-anchor="middle">设计示意</text><rect x="1542" y="15" width="114" height="42" rx="7" fill="#263135" stroke="#354247" /><text x="1599" y="42" font-size="17" fill="#A5B4B6" font-weight="500" text-anchor="middle">保存项目</text><rect x="1668" y="15" width="118" height="42" rx="7" fill="#263135" stroke="#354247" /><text x="1727" y="42" font-size="17" fill="#A5B4B6" font-weight="500" text-anchor="middle">导出成果</text><rect x="1798" y="15" width="98" height="42" rx="7" fill="none" stroke="none" /><text x="1847" y="42" font-size="17" fill="#EAF1F0" font-weight="500" text-anchor="middle">项目  ▾</text><text x="32" y="124" font-size="32" fill="#EAF1F0" font-weight="600" >从重建结果开始。</text><text x="32" y="158" font-size="17" fill="#A5B4B6" font-weight="400" >导入 RealityScan 提供的 images 与 COLMAP，检查后直接训练。</text><rect x="32" y="205" width="1138" height="670" rx="8" fill="#1B2225" stroke="#354247" /><text x="56" y="243" font-size="21" fill="#EAF1F0" font-weight="600" >新建训练项目</text><text x="56" y="273" font-size="16" fill="#A5B4B6" font-weight="400" >源文件保持只读；支持中文路径、空格与图片子目录</text><rect x="70" y="325" width="1062" height="338" rx="10" fill="#121719" stroke="#354247" stroke-dasharray="8 6"/><polygon points="563,393 597,393 609,407 660,407 660,448 563,448" fill="none" stroke="#77D6C3" stroke-width="3"/><text x="601" y="502" font-size="28" fill="#EAF1F0" font-weight="600" text-anchor="middle">拖入数据集文件夹</text><text x="601" y="541" font-size="18" fill="#A5B4B6" font-weight="400" text-anchor="middle">或分别指定 Images / COLMAP / 可选 Masks</text><rect x="479" y="579" width="244" height="48" rx="7" fill="#77D6C3" stroke="none" /><text x="601" y="609" font-size="17" fill="#102A24" font-weight="600" text-anchor="middle">选择数据集</text><text x="72" y="720" font-size="18" fill="#A5B4B6" font-weight="400" >支持 cameras / images / points3D 的 BIN 与 TXT。</text><text x="72" y="749" font-size="18" fill="#A5B4B6" font-weight="400" >发现多个重建模型时，需要明确选择一个。</text><text x="72" y="778" font-size="18" fill="#A5B4B6" font-weight="400" >已有训练 / 验证分组将保留，不混入训练。</text><rect x="1202" y="205" width="686" height="670" rx="8" fill="#1B2225" stroke="#354247" /><text x="1226" y="243" font-size="21" fill="#EAF1F0" font-weight="600" >已有项目</text><text x="1226" y="273" font-size="16" fill="#A5B4B6" font-weight="400" >恢复数据引用、观察位置、编辑版本和检查点关联</text><rect x="1230" y="311" width="630" height="48" rx="7" fill="#263135" stroke="none" /><text x="1545" y="341" font-size="17" fill="#EAF1F0" font-weight="500" text-anchor="middle">打开项目…</text><line x1="1230" y1="401" x2="1860" y2="401" stroke="#354247" stroke-width="1" /><text x="1230" y="447" font-size="20" fill="#EAF1F0" font-weight="600" >最近项目</text><text x="1230" y="490" font-size="18" fill="#A5B4B6" font-weight="400" >此页示意为空工作区。</text><text x="1230" y="519" font-size="18" fill="#A5B4B6" font-weight="400" >打开项目后将核对源数据及保存状态。</text><text x="1230" y="548" font-size="18" fill="#A5B4B6" font-weight="400" >恢复训练使用实际有效检查点。</text><rect x="1230" y="665" width="630" height="80" rx="7" fill="#302728" stroke="none" /><text x="1248" y="693" font-size="18" fill="#EDC17C" font-weight="600" >! 导出暂不可用</text><text x="1248" y="722" font-size="16" fill="#A5B4B6" font-weight="400" >当前没有可导出的模型快照。</text><text x="32" y="963" font-size="20" fill="#A5B4B6" font-weight="400" >01  导入与检查   →   02  训练与观察   →   03  快照编辑   →   04  导出成果</text><line x1="0" y1="1046" x2="1920" y2="1046" stroke="#354247" stroke-width="1" /><text x="24" y="1068" font-size="14" fill="#A5B4B6" font-weight="400" >设计示意 · 静态设计 · 素材、进度、异常均为示意</text><text x="1896" y="1068" font-size="13" fill="#A5B4B6" font-weight="500" text-anchor="end">A-P01 / 空项目</text>
</g></svg>
