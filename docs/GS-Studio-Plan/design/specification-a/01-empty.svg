<title id="title">A-P01 空项目</title>
<desc id="desc">DEV-04 A 深色专业工作台。设计示意，不可交互。物理画布 1920×1080，逻辑布局 1920×1080。所有街景、运行数值和异常均为模拟，不是训练或 DPI 验收证据。</desc>
